<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>game-ocr-bench 領域アノテーション</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, "Segoe UI", sans-serif; margin: 0; background:#1e1e1e; color:#eee; }
  header { padding:10px 14px; background:#252526; border-bottom:1px solid #444; display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
  header h1 { font-size:15px; margin:0; }
  main { display:flex; gap:12px; padding:12px; align-items:flex-start; }
  #canvasWrap { max-height:80vh; overflow:auto; border:1px solid #444; background:#111; }
  canvas { display:block; cursor:crosshair; }
  #side { width:440px; flex:0 0 auto; }
  .panel { background:#252526; border:1px solid #444; border-radius:6px; padding:10px; margin-bottom:10px; }
  .panel h2 { font-size:13px; margin:0 0 8px; color:#fff; }
  table { border-collapse:collapse; width:100%; font-size:12px; }
  th,td { border:1px solid #3a3a3a; padding:3px 4px; }
  input, select, button, textarea { background:#333; color:#eee; border:1px solid #555; border-radius:4px; padding:3px 6px; font-size:12px; }
  input[type=text]{ width:100%; box-sizing:border-box; }
  button { cursor:pointer; }
  button.primary { background:#0e639c; border-color:#0e639c; }
  .meta-grid { display:grid; grid-template-columns:auto 1fr; gap:4px 8px; align-items:center; font-size:12px; }
  textarea { width:100%; height:120px; box-sizing:border-box; font-family:monospace; }
  .hint { color:#aaa; font-size:11px; }
  .row-btns button { padding:1px 5px; }
</style>
</head>
<body>
<header>
  <h1>領域アノテーション（regions/NNNN.json 生成）</h1>
  <label>画像: <input type="file" id="file" accept="image/png"></label>
  <span>拡大:
    <button data-scale="0.5">50%</button>
    <button data-scale="1">100%</button>
    <button data-scale="1.5">150%</button>
  </span>
  <span class="hint">画像上をドラッグして矩形を描く → 右で文字などを入力 → JSON を保存</span>
</header>
<main>
  <div id="canvasWrap"><canvas id="cv" width="10" height="10"></canvas></div>
  <div id="side">
    <div class="panel">
      <h2>サンプルのタグ（samples.meta / §2.2）</h2>
      <div class="meta-grid" id="metaGrid"></div>
    </div>
    <div class="panel">
      <h2>領域（reading_order = 上から順）</h2>
      <table id="tbl"><thead><tr>
        <th>id</th><th>text</th><th>type</th><th>proper_nouns</th><th>box</th><th></th>
      </tr></thead><tbody></tbody></table>
      <p class="hint">proper_nouns はカンマ区切り。box は自動。行の ▲▼ で読み順変更、✕ で削除。</p>
    </div>
    <div class="panel">
      <h2>出力</h2>
      <button class="primary" id="download">regions JSON を保存</button>
      <button id="copy">JSON をコピー</button>
      <p class="hint">全画面 GT（reading_order 連結・自動生成のプレビュー）:</p>
      <textarea id="gtPreview" readonly></textarea>
      <p class="hint">JSON:</p>
      <textarea id="jsonOut" readonly></textarea>
    </div>
  </div>
</main>
<script>
const TEXT_TYPES = ["hud","dialogue","menu","tooltip","map_label","damage"];
const META_TAGS = {
  font_style: ["","pixel","sans","serif","fantasy","handwritten_style"],
  outline: ["","none","thin","thick"],
  shadow: ["","true","false"],
  overlay: ["","none","semi_transparent","on_texture"],
  contrast: ["","high","mid","low"],
  text_color: ["","white","yellow","red","multi"],
  resolution: ["","1080p","1440p","4k"],
  density: ["","sparse","dense"],
};

let img = new Image();
let imgName = "0003.png";
let scale = 1;
let boxes = [];        // {text, text_type, proper_nouns, x,y,w,h}
let drawing = null;    // {x0,y0,x1,y1}
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

// メタ入力を構築
const metaGrid = document.getElementById("metaGrid");
const metaInputs = {};
for (const [k, opts] of Object.entries(META_TAGS)) {
  const lab = document.createElement("label"); lab.textContent = k;
  const sel = document.createElement("select");
  for (const o of opts){ const op=document.createElement("option"); op.value=o; op.textContent=o||"(未設定)"; sel.appendChild(op); }
  sel.addEventListener("change", render);
  metaGrid.appendChild(lab); metaGrid.appendChild(sel); metaInputs[k]=sel;
}

document.getElementById("file").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  imgName = f.name;
  const url = URL.createObjectURL(f);
  img = new Image();
  img.onload = () => { applyScale(); };
  img.src = url;
});

document.querySelectorAll("header button[data-scale]").forEach(b =>
  b.addEventListener("click", () => { scale = parseFloat(b.dataset.scale); applyScale(); }));

function applyScale(){
  cv.width = img.naturalWidth || 10;
  cv.height = img.naturalHeight || 10;
  cv.style.width = (cv.width * scale) + "px";
  cv.style.height = (cv.height * scale) + "px";
  render();
}

function toPixel(e){
  const rect = cv.getBoundingClientRect();
  const sx = cv.width / rect.width, sy = cv.height / rect.height;
  return { x: Math.round((e.clientX-rect.left)*sx), y: Math.round((e.clientY-rect.top)*sy) };
}

cv.addEventListener("mousedown", e => { const p=toPixel(e); drawing={x0:p.x,y0:p.y,x1:p.x,y1:p.y}; });
cv.addEventListener("mousemove", e => { if(!drawing) return; const p=toPixel(e); drawing.x1=p.x; drawing.y1=p.y; render(); });
window.addEventListener("mouseup", () => {
  if(!drawing) return;
  const x=Math.min(drawing.x0,drawing.x1), y=Math.min(drawing.y0,drawing.y1);
  const w=Math.abs(drawing.x1-drawing.x0), h=Math.abs(drawing.y1-drawing.y0);
  if (w>4 && h>4) boxes.push({text:"",text_type:"hud",proper_nouns:"",x,y,w,h});
  drawing=null; render();
});

function render(){
  ctx.clearRect(0,0,cv.width,cv.height);
  if (img && img.naturalWidth) ctx.drawImage(img,0,0);
  ctx.lineWidth = 2/scale;
  boxes.forEach((b,i) => {
    ctx.strokeStyle = "#00e676";
    ctx.strokeRect(b.x,b.y,b.w,b.h);
    ctx.fillStyle = "#00e676"; ctx.font = `${16/scale}px sans-serif`;
    ctx.fillText("r"+(i+1), b.x+2, b.y-4/scale);
  });
  if (drawing){
    ctx.strokeStyle="#ffab00";
    ctx.strokeRect(Math.min(drawing.x0,drawing.x1),Math.min(drawing.y0,drawing.y1),
      Math.abs(drawing.x1-drawing.x0),Math.abs(drawing.y1-drawing.y0));
  }
  renderTable(); renderOut();
}

function renderTable(){
  const tb = document.querySelector("#tbl tbody"); tb.innerHTML="";
  boxes.forEach((b,i) => {
    const tr = document.createElement("tr");
    const typeOpts = TEXT_TYPES.map(t=>`<option ${t===b.text_type?"selected":""}>${t}</option>`).join("");
    tr.innerHTML =
      `<td>r${i+1}</td>`+
      `<td><input type="text" value="${escapeHtml(b.text)}" data-i="${i}" data-f="text"></td>`+
      `<td><select data-i="${i}" data-f="text_type">${typeOpts}</select></td>`+
      `<td><input type="text" value="${escapeHtml(b.proper_nouns)}" data-i="${i}" data-f="proper_nouns"></td>`+
      `<td>${b.x},${b.y},${b.w},${b.h}</td>`+
      `<td class="row-btns"><button data-up="${i}">▲</button><button data-down="${i}">▼</button><button data-del="${i}">✕</button></td>`;
    tb.appendChild(tr);
  });
  tb.querySelectorAll("input,select").forEach(el => el.addEventListener("input", e => {
    boxes[+e.target.dataset.i][e.target.dataset.f] = e.target.value; renderOut();
  }));
  tb.querySelectorAll("[data-del]").forEach(el => el.addEventListener("click",e=>{ boxes.splice(+el.dataset.del,1); render(); }));
  tb.querySelectorAll("[data-up]").forEach(el => el.addEventListener("click",e=>{ const i=+el.dataset.up; if(i>0){ [boxes[i-1],boxes[i]]=[boxes[i],boxes[i-1]]; render(); }}));
  tb.querySelectorAll("[data-down]").forEach(el => el.addEventListener("click",e=>{ const i=+el.dataset.down; if(i<boxes.length-1){ [boxes[i+1],boxes[i]]=[boxes[i],boxes[i+1]]; render(); }}));
}

function buildDoc(){
  const meta={};
  for (const [k,sel] of Object.entries(metaInputs)) if (sel.value) meta[k]=sel.value;
  const regions = boxes.map((b,i)=>({
    id:"r"+(i+1), box:[b.x,b.y,b.w,b.h], text:b.text, text_type:b.text_type,
    proper_nouns: b.proper_nouns.split(",").map(s=>s.trim()).filter(Boolean)
  }));
  return { image: imgName, reading_order: regions.map(r=>r.id), regions, meta };
}

function renderOut(){
  const doc = buildDoc();
  document.getElementById("jsonOut").value = JSON.stringify(doc, null, 2);
  document.getElementById("gtPreview").value = doc.regions.map(r=>r.text).join("\n");
}

document.getElementById("download").addEventListener("click", () => {
  const doc = buildDoc();
  const blob = new Blob([JSON.stringify(doc,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = imgName.replace(/\.[^.]+$/,"") + ".json";
  a.click();
});
document.getElementById("copy").addEventListener("click", () => {
  navigator.clipboard.writeText(document.getElementById("jsonOut").value);
});

function escapeHtml(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
render();
</script>
</body>
</html>
