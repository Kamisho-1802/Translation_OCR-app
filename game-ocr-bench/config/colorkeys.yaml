# 色キーイングの色域プリセット（仕様書 §3.3 / §13-2）。
# HSV（OpenCV 準拠: H 0-179, S 0-255, V 0-255）。text_color タグ別に持つ。
# まず white / yellow / red の 3 種（§13 推奨）。lo/hi は複数レンジで OR 合成可。

white:
  - {lo: [0, 0, 200], hi: [179, 40, 255]}      # 低彩度・高明度

yellow:
  - {lo: [20, 80, 120], hi: [35, 255, 255]}

red:
  - {lo: [0, 80, 100], hi: [10, 255, 255]}      # 赤は色相の両端に跨る
  - {lo: [170, 80, 100], hi: [179, 255, 255]}
